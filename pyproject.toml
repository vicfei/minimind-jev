[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minimind-jev"
version = "0.1.0"
description = "Train your own tiny Jev (System One decision model): frozen encoder + from-scratch decision head, CPU-friendly; roadmap to a fully from-scratch tiny transformer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["torch>=2.2", "sentence-transformers>=3", "pyarrow>=14"]

[project.urls]
Benchmark = "https://github.com/vicfei/jev-rag-zh-benchmark"
Patterns = "https://github.com/vicfei/awesome-jev-prompts"
